name: Account emails

# Applies the branded ELEV8 account emails (confirm, reset password, change email, sign-in link,
# invite, security code), the Site URL and the allowed redirect URLs to Supabase.
# Runs by hand from the Actions tab, and again whenever the templates change.
# Needs the SUPABASE_ACCESS_TOKEN secret (a personal access token from supabase.com/dashboard/account/tokens).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would change"
        type: boolean
        required: false
        default: false
  push:
    paths:
      - "site/email-templates/make_templates.py"
      - "site/apply_auth_config.py"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Add the SUPABASE_ACCESS_TOKEN secret (Settings > Secrets and variables > Actions), then run this workflow again."
            python3 site/apply_auth_config.py --dry-run
            exit 0
          fi
          python3 site/apply_auth_config.py ${{ inputs.dry_run && '--dry-run' || '' }}
