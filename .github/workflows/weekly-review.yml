name: Weekly review emails

# Every Sunday at 10am Irish time, emails each user who turned on
# "Email me my weekly review" their week, from reviews@elev8tradingjournal.com via Resend.
# Run it by hand with an email address to send a one-off test to just that account.
on:
  # GitHub schedules run on UTC, and Ireland is UTC+1 in summer and UTC+0 in winter. It fires at
  # 09:00 and 10:00 UTC; the first step lets through only the one that is 10am in Dublin that day.
  schedule:
    - cron: "0 9 * * 0"
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      only_email:
        description: "Send a test to just this account's email (leave blank to send to everyone opted in)"
        required: false
        default: ""
      preview_all:
        description: "One-off preview to every confirmed account (with a 'turn it on in Settings' note)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Only at 10am Irish time
        id: when
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Runs started by hand always send. Scheduled ones send only from the slot that is 10am in Dublin
          # (decided by the slot, not the clock, so a late start by GitHub doesn't skip the week).
          offset=$(TZ=Europe/Dublin date +%z)
          if [ -z "$SCHEDULE" ] || { [ "$SCHEDULE" = "0 9 * * 0" ] && [ "$offset" = "+0100" ]; } || { [ "$SCHEDULE" = "0 10 * * 0" ] && [ "$offset" = "+0000" ]; }; then
            echo "send=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Not 10am in Dublin for this slot ($SCHEDULE, Dublin is UTC$offset); the other slot sends."
          fi
      - uses: actions/checkout@v5
        if: steps.when.outputs.send == 'yes'
      - name: Send weekly reviews
        if: steps.when.outputs.send == 'yes'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ONLY_EMAIL: ${{ github.event.inputs.only_email }}
          PREVIEW_ALL: ${{ github.event.inputs.preview_all }}
        run: python3 site/weekly_review.py
