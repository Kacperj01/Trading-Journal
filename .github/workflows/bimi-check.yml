name: BIMI check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== DMARC"; dig +short TXT _dmarc.elev8tradingjournal.com @1.1.1.1
          echo "== BIMI"; dig +short TXT default._bimi.elev8tradingjournal.com @1.1.1.1
          echo "== DKIM (resend)"; dig +short TXT resend._domainkey.elev8tradingjournal.com @1.1.1.1 | cut -c1-60
          echo "== SPF (send)"; dig +short TXT send.elev8tradingjournal.com @1.1.1.1
          echo "== logo"; curl -sS -o logo.svg -w "status %{http_code} type %{content_type} size %{size_download}\n" https://elev8tradingjournal.com/bimi-logo.svg
          head -c 160 logo.svg; echo
